name: Company Scout

# Runs Mon/Wed/Fri, roughly morning Europe/Madrid. GitHub Actions' schedule
# trigger is best-effort and has been firing these runs 4-11 hours late
# (see git history) — often enough that an earlier version of this workflow
# gated every step on "is it currently 10am Madrid?" and, because of that
# lateness, ended up skipping the actual scout step on every single run for
# weeks. Dropped that gate: better to run late than not at all.
#
# Single cron entry now (the old version had two — one for CEST, one for
# CET — because a Madrid-time gate used to pick whichever one landed on
# 10am local across the DST split). With that gate gone, two entries would
# just run the scout twice a day instead of once, so this keeps only the
# winter/CET time. Offset to :17 rather than :00 since GitHub's queues are
# most congested at the top of the hour.
on:
  schedule:
    - cron: '17 9 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout-companies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scout_company.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add known_companies.json company_scout_state.json
          git diff --staged --quiet || git commit -m "update company scout state"
          git pull --rebase origin main
          git push
