name: Company Scout

# Runs Mon/Wed/Fri at 10:00 Europe/Madrid time. GitHub Actions cron is always
# UTC and can't track DST on its own, so this fires at both UTC times that
# 10:00 Madrid can land on (08:00 UTC in CEST/summer, 09:00 UTC in CET/winter)
# and the "Check Madrid local time" step below skips every step except the
# one that actually lands on 10:00 local — see that step for how.
#
# Offset to :17 rather than :00 — GitHub's schedule trigger is best-effort
# and queues get congested at the top of the hour (every repo's cron fires
# there too), which was causing multi-hour delays. The local-hour check
# below still works fine off a 17-minute offset since Madrid's UTC offset
# is always a whole number of hours.
on:
  schedule:
    - cron: '17 8 * * 1,3,5'
    - cron: '17 9 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout-companies:
    runs-on: ubuntu-latest
    steps:
      - name: Check Madrid local time
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — running regardless of time."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            HOUR="$(TZ=Europe/Madrid date +%H)"
            echo "Madrid local hour: $HOUR"
            if [ "$HOUR" = "10" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v3
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-python@v4
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        if: steps.check.outputs.run == 'true'
      - run: python scout_company.py
        if: steps.check.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      - name: Save state
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add known_companies.json company_scout_state.json
          git diff --staged --quiet || git commit -m "update company scout state"
          git pull --rebase origin main
          git push
